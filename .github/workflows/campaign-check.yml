name: campaign-check

# 毎月1日・15日の 09:00(JST) に自動実行。Actions タブから手動実行も可。
on:
  schedule:
    - cron: "0 0 1,15 * *"   # 00:00 UTC = 09:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: campaign-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 巡回して差分をチェック
        id: check
        run: python3 automation/check_sources.py

      - name: (Full版・任意) AI で修正案を作る
        if: steps.check.outputs.has_changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 automation/propose_edits.py

      - name: 変化があれば Pull Request を作成
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="campaign-check/${DATE}-${GITHUB_RUN_ID}"
          git config user.name  "minogasan-bot"
          git config user.email "momokachan2004@gmail.com"
          git checkout -b "$BRANCH"
          git add automation/snapshots automation/LAST_REPORT.md
          git commit -m "campaign check ${DATE}: ${{ steps.check.outputs.summary }}"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "campaign check ${DATE}" \
            --body-file automation/LAST_REPORT.md
